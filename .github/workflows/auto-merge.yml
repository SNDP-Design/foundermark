name: Auto Merge rocket-update into main

on:
  push:
    branches:
      - rocket-update

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge rocket-update into main
        run: |
          git checkout main
          git merge origin/rocket-update --no-ff -m "Auto-merge: rocket-update into main [skip ci]"
          git push origin main
